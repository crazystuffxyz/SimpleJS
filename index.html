<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SimpleJS - The best JavaScript simplifier</title>
  <style>
    /* Global Styles */
    body {
      background-color: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.5rem;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .controls label {
      font-size: 1rem;
    }
    .controls input,
    .controls button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }
    .controls input {
      width: 80px;
      background-color: #252526;
      color: #d4d4d4;
    }
    .controls button {
      background-color: #0e639c;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .controls button:hover {
      background-color: #1177bb;
    }
    .editors {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .editor-container {
      flex: 1 1 45%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .editor-container h2 {
      margin-bottom: 10px;
    }
    
    /* Updated Editor Styles for Textarea */
    .editor {
      height: 400px;
      width: 100%;
      background-color: #252526;
      color: #d4d4d4;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 15px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box; /* Ensures padding doesn't affect width */
    }
    
    /* Loading Spinner */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(30, 30, 30, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      z-index: 10;
    }
    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #0e639c;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Responsive */
    @media (max-width: 768px) {
      .editors {
        flex-direction: column;
      }
      .editor-container {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SimpleJS - The best JavaScript simplifier</h1>
    </header>
    <section class="controls">
      <label for="layersInput">Layers:</label>
      <input type="number" id="layersInput" min="1" value="1" />
      <button id="simplifyButton">Simplify!</button>
    </section>
    <section class="editors">
      <div class="editor-container">
        <h2>Input Code</h2>
        <!-- Changed to textarea -->
        <textarea id="inputEditor" class="editor" placeholder="Paste your JavaScript code here..."></textarea>
      </div>
      <div class="editor-container">
        <h2>Output Code</h2>
        <!-- Changed to textarea and added readonly -->
        <textarea id="outputEditor" class="editor" readonly></textarea>
        <!-- Loading overlay -->
        <div id="loading" class="loading-overlay">
          <div class="spinner"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="simplifyCode.js"></script>
  <script>
    // Get references to elements
    const inputEditor = document.getElementById("inputEditor");
    const outputEditor = document.getElementById("outputEditor");
    const simplifyButton = document.getElementById("simplifyButton");
    const loadingOverlay = document.getElementById("loading");

    // When the Simplify button is clicked...
    simplifyButton.addEventListener("click", function() {
      // Show the loading spinner
      loadingOverlay.style.display = "flex";
      
      setTimeout(async function() {
        // Use .value to get/set textarea content
        var code = inputEditor.value;
        var layers = parseInt(document.getElementById("layersInput").value) || 1;
        
        // Call the global simplifyCode function
        var result = await simplifyCode(code, layers);
        
        // Display the result
        outputEditor.value = result;
        
        // Hide the loading spinner
        loadingOverlay.style.display = "none";
      }, 100);
    });
  </script>
</body>
</html>
